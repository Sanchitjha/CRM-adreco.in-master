AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Adreco CRM, highly available: containers on ECS Fargate in two or more Availability Zones behind an
  Application Load Balancer, RDS PostgreSQL, and a private S3 bucket for documents.

# Create this stack from the CloudFormation console (see DEPLOYMENT.md). It is meant to be created with
# DesiredCount 0, then updated to 2 once the first image has been pushed and the database migrated.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Public address }
        Parameters: [DomainName, CertificateArn, HostedZoneId]
      - Label: { default: Network (use the default VPC and two or more of its subnets) }
        Parameters: [VpcId, SubnetIds]
      - Label: { default: Application }
        Parameters: [DesiredCount, TaskSize, ImageTag, EnvFileKey]
      - Label: { default: Database }
        Parameters: [DbEngineVersion, DbInstanceClass, DbMultiAz, DbAllocatedStorage]
      - Label: { default: Alerts and deployments }
        Parameters: [AlarmEmail, GitHubRepo, CreateGitHubOidcProvider]

Parameters:
  DomainName:
    Type: String
    Default: crm.adreco.in
    Description: The address people will type to open the CRM.
    AllowedPattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$
  CertificateArn:
    Type: String
    Description: ARN of an ISSUED AWS Certificate Manager certificate for the domain, created in this same region.
    AllowedPattern: ^arn:aws:acm:[a-z0-9-]+:[0-9]+:certificate/[a-f0-9-]+$
  HostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 hosted zone ID for the domain. Leave empty if your DNS is elsewhere; you will add a CNAME yourself.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The VPC to run in. The default VPC is fine.
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two or more PUBLIC subnets in different Availability Zones (the default VPC's subnets are).
  DesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 10
    Description: How many copies of the CRM to run. Create the stack with 0, push the image and run the migration, then change this to 2.
  TaskSize:
    Type: String
    Default: Small
    AllowedValues: [Small, Medium, Large]
    Description: Size of each copy. Small is 0.5 vCPU and 1 GB, Medium is 1 vCPU and 2 GB, Large is 2 vCPU and 4 GB.
  ImageTag:
    Type: String
    Default: latest
    Description: Which image in the repository to run. Use a commit ID to roll back to an earlier version.
  EnvFileKey:
    Type: String
    Default: ""
    AllowedPattern: ^(config/[^\s]+)?$
    Description: >-
      Optional. Path inside the documents bucket of a .env file holding your email, AI, WhatsApp and Zoho settings.
      It must start with config/, for example config/app.env. Leave empty at first.
  DbEngineVersion:
    Type: String
    Default: "16.12"
    AllowedPattern: ^16\.[0-9]+$
    Description: PostgreSQL 16 version for the database. Leave as is unless CloudFormation says it is unavailable in your region; then choose another 16.x offered on the RDS Create database page.
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t4g.small, db.t4g.medium, db.m6g.large]
  DbMultiAz:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Set to true to keep a standby database in a second zone. Survives a database failure; roughly doubles the database cost.
  DbAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 1000
    Description: Database storage in GB.
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional. An address to email when the CRM becomes unhealthy or the database runs low on space.
  GitHubRepo:
    Type: String
    Default: Sanchitjha/CRM-adreco.in-master
    Description: The GitHub repository allowed to deploy (owner/name).
  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Let GitHub deploy without stored passwords. Set to false if this AWS account already has a GitHub identity provider.

Mappings:
  TaskSizes:
    Small: { Cpu: "512", Memory: "1024" }
    Medium: { Cpu: "1024", Memory: "2048" }
    Large: { Cpu: "2048", Memory: "4096" }

Conditions:
  HasHostedZone: !Not [!Equals [!Ref HostedZoneId, ""]]
  HasEnvFile: !Not [!Equals [!Ref EnvFileKey, ""]]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]
  CreateOidcProvider: !Equals [!Ref CreateGitHubOidcProvider, "true"]

Resources:
  # ------------------------------------------------------------------ Network access
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Adreco CRM load balancer (public web traffic)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Adreco CRM containers (only the load balancer may connect)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Adreco CRM database (only the containers may connect)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroup

  # ------------------------------------------------------------------ Secrets (generated, never typed)
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Master login for the Adreco CRM database
      GenerateSecretString:
        SecretStringTemplate: '{"username": "adreco"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  AuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Signs login sessions (AUTH_SECRET). Changing it signs everyone out.
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  CronSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Shared secret the daily digest scheduler sends (CRON_SECRET)
      GenerateSecretString:
        PasswordLength: 40
        ExcludePunctuation: true

  # ------------------------------------------------------------------ Database
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Adreco CRM database subnets
      SubnetIds: !Ref SubnetIds

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: !Ref DbEngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      DBName: adreco_crm
      MasterUsername: !Sub "{{resolve:secretsmanager:${DatabaseSecret}:SecretString:username}}"
      MasterUserPassword: !Sub >-
        {{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}
      MultiAZ: !Ref DbMultiAz
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      BackupRetentionPeriod: 14
      PreferredBackupWindow: "21:00-22:00"
      PreferredMaintenanceWindow: "sun:22:00-sun:23:00"
      DeletionProtection: true
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: true

  # Encrypted in transit; the certificate is not verified (a known limitation of Prisma with RDS, see DEPLOYMENT.md).
  DatabaseUrlSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Connection string used by the app and the migration task (DATABASE_URL)
      SecretString: !Sub >-
        postgresql://{{resolve:secretsmanager:${DatabaseSecret}:SecretString:username}}:{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}@${Database.Endpoint.Address}:${Database.Endpoint.Port}/adreco_crm?sslmode=require&sslaccept=accept_invalid_certs&connection_limit=5

  # ------------------------------------------------------------------ Documents
  DocumentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
      # Documents are uploaded straight from the browser with a short-lived signed link.
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Sub "https://${DomainName}"]
            AllowedMethods: [PUT, GET]
            AllowedHeaders: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3000

  DocumentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DocumentsBucket.Arn
              - !Sub "${DocumentsBucket.Arn}/*"
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  # ------------------------------------------------------------------ Images
  Repository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: adreco-crm
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Keep the 30 newest images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}}]}

  # ------------------------------------------------------------------ Containers
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: adreco-crm

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /adreco-crm
      RetentionInDays: 30

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-app-settings
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref DatabaseUrlSecret, !Ref AuthSecret, !Ref CronSecret]
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DocumentsBucket.Arn}/config/*"
              - Effect: Allow
                Action: s3:GetBucketLocation
                Resource: !GetAtt DocumentsBucket.Arn

  # What the running app may do: read and write customer documents, nothing else.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: customer-documents
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "${DocumentsBucket.Arn}/leads/*"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: adreco-crm
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !FindInMap [TaskSizes, !Ref TaskSize, Cpu]
      Memory: !FindInMap [TaskSizes, !Ref TaskSize, Memory]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ContainerDefinitions:
        - Name: app
          Image: !Sub "${Repository.RepositoryUri}:${ImageTag}"
          Essential: true
          PortMappings:
            - { ContainerPort: 3000, Protocol: tcp }
          Environment:
            - { Name: AUTH_URL, Value: !Sub "https://${DomainName}" }
            - { Name: AWS_REGION, Value: !Ref "AWS::Region" }
            - { Name: S3_BUCKET_NAME, Value: !Ref DocumentsBucket }
          Secrets:
            - { Name: DATABASE_URL, ValueFrom: !Ref DatabaseUrlSecret }
            - { Name: AUTH_SECRET, ValueFrom: !Ref AuthSecret }
            - { Name: CRON_SECRET, ValueFrom: !Ref CronSecret }
          EnvironmentFiles: !If
            - HasEnvFile
            - - { Type: s3, Value: !Sub "${DocumentsBucket.Arn}/${EnvFileKey}" }
            - !Ref AWS::NoValue
          HealthCheck:
            Command: [CMD-SHELL, "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: app

  # One-off task that applies database changes. Runs the "migrator" image; the deploy workflow starts it.
  MigrationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: adreco-crm-migrate
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ContainerDefinitions:
        - Name: migrate
          Image: !Sub "${Repository.RepositoryUri}:migrator"
          Essential: true
          Secrets:
            - { Name: DATABASE_URL, ValueFrom: !Ref DatabaseUrlSecret }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: migrate

  # ------------------------------------------------------------------ Load balancer
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      Subnets: !Ref SubnetIds
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: "60" }
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      VpcId: !Ref VpcId
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      ServiceName: adreco-crm
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 90
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref AppSecurityGroup]
          Subnets: !Ref SubnetIds
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroup

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasHostedZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID

  # ------------------------------------------------------------------ Daily digest at 08:00 India time (02:30 UTC)
  DigestConnection:
    Type: AWS::Events::Connection
    Properties:
      Description: Sends the CRM's cron secret as a header
      AuthorizationType: API_KEY
      AuthParameters:
        ApiKeyAuthParameters:
          ApiKeyName: x-cron-secret
          ApiKeyValue: !Sub "{{resolve:secretsmanager:${CronSecret}:SecretString}}"

  DigestDestination:
    Type: AWS::Events::ApiDestination
    Properties:
      ConnectionArn: !GetAtt DigestConnection.Arn
      HttpMethod: POST
      InvocationEndpoint: !Sub "https://${DomainName}/api/cron/digest"
      InvocationRateLimitPerSecond: 1

  DigestRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: call-digest
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: events:InvokeApiDestination
                Resource: !GetAtt DigestDestination.Arn

  DigestRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Email each person what is due today
      ScheduleExpression: cron(30 2 * * ? *)
      State: ENABLED
      Targets:
        - Id: digest
          Arn: !GetAtt DigestDestination.Arn
          RoleArn: !GetAtt DigestRole.Arn

  # ------------------------------------------------------------------ Alerts (only when an email address is given)
  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail

  AlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  UnhealthyContainersAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmEmail
    Properties:
      AlarmDescription: A CRM container is failing its health check
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - { Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName }
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 5
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  ServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmEmail
    Properties:
      AlarmDescription: The CRM is returning many server errors
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - { Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName }
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  DatabaseStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmEmail
    Properties:
      AlarmDescription: The database has less than 2 GB of free space
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - { Name: DBInstanceIdentifier, Value: !Ref Database }
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2147483648
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  DatabaseCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmEmail
    Properties:
      AlarmDescription: The database has been busy for 15 minutes
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - { Name: DBInstanceIdentifier, Value: !Ref Database }
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # ------------------------------------------------------------------ Deploying from GitHub without stored passwords
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Lets the "Deploy to AWS" workflow on the main branch push images and roll out a new version
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubRepo}:ref:refs/heads/main"
      Policies:
        - PolicyName: deploy-adreco-crm
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt Repository.Arn
              - Effect: Allow
                Action: [ecs:DescribeServices, ecs:DescribeTasks, ecs:DescribeTaskDefinition]
                Resource: "*"
              - Effect: Allow
                Action: ecs:UpdateService
                Resource: !Ref Service
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/adreco-crm-migrate:*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: [!GetAtt TaskExecutionRole.Arn, !GetAtt TaskRole.Arn]
                Condition:
                  StringEquals: { "iam:PassedToService": ecs-tasks.amazonaws.com }

Outputs:
  AppUrl:
    Description: Where the CRM will be reachable once DNS points at the load balancer
    Value: !Sub "https://${DomainName}"
  LoadBalancerDnsName:
    Description: If your DNS is not in Route 53, create a CNAME for the domain pointing at this name
    Value: !GetAtt LoadBalancer.DNSName
  GitHubDeployRoleArn:
    Description: Save as the repository variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt GitHubDeployRole.Arn
  Region:
    Description: Save as the repository variable AWS_REGION
    Value: !Ref "AWS::Region"
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  DocumentsBucketName:
    Description: Holds customer documents. Put the optional settings file under config/ in this bucket.
    Value: !Ref DocumentsBucket
  LogGroupName:
    Value: !Ref LogGroup
